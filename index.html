<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef0f5">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1120">
<meta name="color-scheme" content="light dark">
<meta name="description" content="A personal watchlist: pick by mood, energy and time, keep a watch diary, track who recommended what, and swipe on what to watch together.">
<title>Reel Room</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#watchlist"><img src="assets/icon.svg" alt="" width="28" height="28"><span>Reel Room</span></a>
  <nav class="tabs" aria-label="Sections">
    <a href="#watchlist" data-tab="watchlist"><span class="ico" aria-hidden="true">▤</span><span>Watchlist</span></a>
    <a href="#add" data-tab="add"><span class="ico" aria-hidden="true">＋</span><span>Add</span></a>
    <a href="#diary" data-tab="diary"><span class="ico" aria-hidden="true">✎</span><span>Diary</span></a>
    <a href="#ledger" data-tab="ledger"><span class="ico" aria-hidden="true">⇄</span><span>Ledger</span></a>
    <a href="#rooms" data-tab="rooms"><span class="ico" aria-hidden="true">♥</span><span>Rooms</span></a>
    <a href="#settings" data-tab="settings"><span class="ico" aria-hidden="true">⚙</span><span>Settings</span></a>
  </nav>
</header>
<main id="view" tabindex="-1"></main>
<dialog id="dlg" aria-labelledby="dlg-title">
  <div class="dlg-inner">
    <header><h2 id="dlg-title"></h2><button class="icon-btn" id="dlg-close" aria-label="Close" type="button">×</button></header>
    <div id="dlg-body"></div>
  </div>
</dialog>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px">Reel Room needs JavaScript to run.</p></noscript>
<script src="config.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
